[project]
name = "voice-changer-ng"
version = "2.0.0"
description = "Next-gen fork of w-okada's realtime voice changer: GPU-resident RVC pipeline, fairseq-free HuBERT, Python 3.12 / CUDA 12."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "numpy>=2.0",
    "onnxruntime-gpu>=1.20",
    "onnx>=1.17",
    "faiss-cpu>=1.9",
    "safetensors>=0.4",
    "torchfcpe>=0.0.4",
    "soxr>=0.5",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-socketio>=5.11",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "websockets>=13",
    "dataclasses-json>=0.6",
    "pyOpenSSL>=24",
    "requests>=2.32",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# CPU pitch extractors (dio/harvest/crepe) and the non-RVC model families
legacy = [
    "pyworld>=0.3.4",
    "torchcrepe>=0.0.23",
    "librosa>=0.10",
    "scipy>=1.13",
    "einops>=0.8",
    "local-attention>=1.9",
    "onnxsim>=0.4.36",
]
# TensorRT engines for the synthesizer (NVIDIA only)
tensorrt = [
    "tensorrt-cu12>=10.6,<11",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
